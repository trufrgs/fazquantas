# Verifica todo push e PR (lint, tipos e testes de unidade) e, na main, publica no Cloudflare:
# primeiro o Worker (servidor do jogo online, com os segredos), depois o site.
# Os testes E2E (Playwright) rodam à mão por enquanto: ver CONTRIBUTING.md.
#
# PR (inclusive de fork) só verifica: nunca publica nem vê segredo. Um fork publica a própria cópia
# com os segredos e as variáveis dele (PAGES_PROJETO, SITE_URL, API_URL): ver "Fazer o teu" no
# CONTRIBUTING.md. Sem eles, a publicação só avisa e para.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  publicar:
    name: Publicar no Cloudflare
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Um deploy por vez; o mais novo espera o anterior terminar.
    concurrency:
      group: publicar-producao
      cancel-in-progress: false
    environment:
      name: producao
      url: ${{ vars.SITE_URL || 'https://fazquantas.pages.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Um fork troca pelas variáveis dele; sem elas, vale o Faz quantas? daqui.
      PAGES_PROJETO: ${{ vars.PAGES_PROJETO || 'fazquantas' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://fazquantas.pages.dev' }}
      API_URL: ${{ vars.API_URL || 'https://fazquantas-api.fancy-night-938c.workers.dev' }}
    steps:
      - name: Tem acesso ao Cloudflare?
        id: acesso
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Sem CLOUDFLARE_API_TOKEN (segredo) ou CLOUDFLARE_ACCOUNT_ID (variável): nada foi publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.acesso.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.acesso.outputs.ok == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.acesso.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.acesso.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      # Código e segredos numa publicação só: cada publicação reinicia as salas (as partidas em
      # andamento reconectam), então duas seguidas (deploy + secret bulk) eram um tranco a mais.
      - name: Worker (servidor do jogo online, com os segredos que existem no GitHub)
        if: steps.acesso.outputs.ok == 'true'
        env:
          VAPID_PRIVADO: ${{ secrets.VAPID_PRIVADO }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
        # Os valores vão num arquivo temporário (nunca em argumentos nem em log) e o arquivo some.
        run: |
          umask 077
          node -e '
            const s = {};
            for (const k of ["VAPID_PRIVADO", "ADMIN_SENHA"]) if (process.env[k]) s[k] = process.env[k];
            process.stdout.write(JSON.stringify(s));
          ' > "$RUNNER_TEMP/segredos.json"
          pnpm --filter @fodinha/worker exec wrangler deploy --message "${GITHUB_SHA::7}" --secrets-file "$RUNNER_TEMP/segredos.json"
          rm -f "$RUNNER_TEMP/segredos.json"

      - name: Site (Cloudflare Pages)
        if: steps.acesso.outputs.ok == 'true'
        env:
          # O site fala com o servidor deste deploy (vazio = o padrão do código, o daqui).
          VITE_SERVER_URL: ${{ vars.API_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          pnpm --filter @fodinha/web build:pages
          pnpm --filter @fodinha/worker exec wrangler pages deploy ../web/dist \
            --project-name "$PAGES_PROJETO" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Saúde da produção
        if: steps.acesso.outputs.ok == 'true'
        run: |
          curl -fsS "$API_URL/api/saude"
          curl -fsS -o /dev/null "$SITE_URL/"
